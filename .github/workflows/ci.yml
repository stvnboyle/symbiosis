name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Unit tests and lint only. Integration tests need AWS credentials and never run here.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -cover
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
