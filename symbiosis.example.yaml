# Copy this file to symbiosis.yaml and fill it in. symbiosis.yaml is git-ignored.
#
# The file is deliberately flat: one "key: value" per line, nothing nested.

# The only AWS account symbiosis is allowed to touch. Every command checks the
# credentials in use against this before doing anything else.
account_id: "123456789012"

# The one region everything is created in.
region: eu-west-2

# The named profile from ~/.aws/config to use.
profile: symbiosis-admin

# Where budget alerts are sent.
alert_email: you@example.com
